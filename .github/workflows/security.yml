---
# Supply-chain and secret scanners. Three jobs: gitleaks walks the full
# commit history and the working tree against its bundled rule set, so a
# credential committed anywhere in the repo's past fails the gate; govulncheck
# and gomodscan run with SARIF output and upload each result to GitHub Code
# Scanning under its own category (govulncheck over the call graph, gomodscan
# over the vendored module set: retraction, deprecation, and OSV
# malicious-package checks).
#
# Triggers cover pull requests and pushes to `main` -- the pushes seed the
# Code Scanning baseline that pull-request diffs compare against -- plus a
# daily cron that catches rules added to gitleaks, and advisories published
# against already-merged dependencies, after the pull request that added
# them. The SARIF jobs surface findings in the Security tab rather than
# failing the run, so a warning-level deprecation does not gate a pull
# request. The blocking gates are gitleaks here and govulncheck in `ci.yml`.
#
# The gitleaks gate is the shared `devtools:gitleaks` task, which pins the
# binary through the vendored payload and asserts the walk reached a commit
# -- gitleaks otherwise exits 0 on a git failure and an empty scan reads as
# a clean one. Each Go job installs the pinned go through a SHA-pinned
# jdx/mise-action and invokes the matching `devtools:*-sarif` mise task, so
# the scan command stays the single source of truth shared with local runs.

name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "26 6 * * *"

permissions:
  contents: read

# See ci.yml: without this a pin can move without its lockfile entry.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks scans every commit's diff, not just
          # the checkout tip.
          fetch-depth: 0
          # The task scans the history reachable from HEAD. On a pull
          # request GitHub checks out a synthetic merge commit by default,
          # which carries a signature and an author line no contributor
          # wrote. Checking out the pull request head ends the scan range
          # at the commits the author pushed. A push or a dispatch has no
          # pull request, so it falls back to the commit that triggered
          # the run.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Installs gitleaks at the version and digest the vendored payload
      # pins, the same way every other gate here resolves its binary.
      - name: Set up the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19

      - name: Scan for committed secrets
        run: mise run devtools:gitleaks

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19
          install_args: go

      - name: Run govulncheck (SARIF)
        run: mise run devtools:vuln-sarif govulncheck.sarif

      - name: Upload govulncheck SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  gomodscan:
    name: gomodscan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19
          install_args: go

      - name: Run gomodscan (SARIF)
        run: mise run devtools:gomodscan-sarif gomodscan.sarif

      - name: Upload gomodscan SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: gomodscan.sarif
          category: gomodscan
