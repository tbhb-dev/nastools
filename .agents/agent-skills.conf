# Repository policy for the agent-commit, agent-pr, and agent-merge-pr
# skills that the devtools packages deploy. Each line is `key = value`;
# the reader never sources this file, and rejects unknown keys, duplicates,
# and symlinks. Keys left out take the skills' defaults. The reviewer,
# GitHub account, required reviewer, merge owner, and delegation come from
# the machine, never from this file.

# Golden files and test baselines. The repository has none, and an empty
# value refuses every merge, so the pattern matches no path.
golden_paths = ^$

# What the merge reads as a loosened gate: suppression markers in an added
# line's trailing comment, lowercase.
loosening_markers = nolint|lint:(file-)?ignore|#nosec|coverage-ignore|shellcheck +disable|lint-curl: *allow|cspell: *(ignore|disable|words)|vale +off|<!-- *vale [a-z0-9.]+ *= *no|rumdl-disable|markdownlint-disable|gitleaks:allow|yamllint disable

# The gate and lint configuration files, where an added exclusion or a
# removed hook counts as loosening.
gate_config_paths = ^([.]golangci[.]yml|[.]go-arch-lint[.]yml|[.]testcoverage[.]yml|[.]gremlins[.]yaml|[.]pre-commit-config[.]yaml|[.]shellcheckrc|[.]leak-allow|[.]vale[.]ini|[.]vale/.*|[.]cspell[.]jsonc|[.]rumdl[.]toml|[.]yamllint[.]yaml|[.]github/workflows/.*|[.]config/mise/.*|mise[.](toml|lock)|[.]agents/agent-skills[.]conf)$

# Paths whose changes go to the owner: the files that set review and CI
# policy, which are CODEOWNERS, this file, and the Claude settings, plus
# the workflows. The workflows stay here as an interim hold until a
# decisioning agent classifies which workflow changes need the owner.
# Everything else merges on independent review. The merge lists the ones
# a pull request changes in its report and does not refuse.
owner_paths = ^([.]github/CODEOWNERS$|[.]github/workflows/|[.]agents/agent-skills[.]conf$|[.]claude/settings[^/]*[.]json$)
constitutional_paths = ^$

# The ignored paths that a merged branch's worktree may hold and still go:
# caches anything can regenerate, build and coverage output, Vale's synced
# styles, and the agent drafts that a commit, a publish, or a merge
# consumed. mise.local.toml, .claude/settings.local.json, and the fuzz
# corpus under testdata/fuzz/ are not disposable.
disposable_ignored = ^(bin|dist|coverage|apm_modules|tmp|[.]rumdl_cache|[.]fix-prose|[.]gremlins)/|^nastools$|^coverage[.](out|html|txt|xml)$|^coverage[.]covdata[^/]*(/|$)|[.]coverprofile$|^gremlins-report[.]json$|^[.]vale/|^[.]cspell-cache$|(^|/)[.]DS_Store$|(^|/)__pycache__/|^(COMMIT_AGENTMSG|PR_AGENTDESC[.]md|SQUASH_AGENTMSG)$
